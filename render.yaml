services:
  - type: web
    name: vsg-retail-dashboard
    runtime: node
    plan: starter          # a disk requires a paid instance
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: INGEST_SECRET
        generateValue: true
    disk:
      name: data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
